aid: mrscraper
name: MrScraper
description: 'MrScraper is an AI-powered web scraping platform: a Scraper API (Web Renderer fetch, Scrape JSON/Markdown, screenshots,
  listing pages and sitemaps on api.mrscraper.com), a Platform API for creating, rerunning and managing scrapers and results
  (api.app.mrscraper.com/api/v1), Google SERP, residential proxies, a hosted OAuth 2.1 MCP server (mcp.mrscraper.com/mcp),
  a CLI with agent skills, Node, Python, LangChain and n8n SDKs, and webhooks.'

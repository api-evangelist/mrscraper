apis:
- name: MrScraper Google SERP API
  description: >-
    Synchronous Google SERP endpoint (POST https://sync.scraper.mrscraper.com/api/google/serp/v2/sync)
    returning structured search results in JSON or HTML from a query or a complete Google search URL;
    documented through the CLI `serp` command and the MCP `serp` tool. No published contract.
  humanURL: https://docs.mrscraper.com/docs/getting-started/mcp-server
  baseURL: https://sync.scraper.mrscraper.com
  tags:
  - Search
  - SERP
  properties:
  - type: Documentation
    url: https://docs.mrscraper.com/docs/getting-started/cli
  aid: mrscraper:mrscraper-google-serp-api
  image: https://mrscraper.com/og.png
- name: MrScraper MCP Server
  description: >-
    Official Model Context Protocol server: hosted Streamable HTTP endpoint at https://mcp.mrscraper.com/mcp
    behind OAuth 2.1 (PKCE, dynamic client registration, scopes scrape:read / scrape:write / account:read)
    with an API-key Bearer fallback, and the same server as the @mrscraper/mcp npm package over stdio.
    Seven documented tools: fetch, scrape, serp, status, rerun, results, result.
  humanURL: https://docs.mrscraper.com/docs/getting-started/mcp-server
  baseURL: https://mcp.mrscraper.com/mcp
  tags:
  - MCP
  - AI Agents
  properties:
  - type: Documentation
    url: https://docs.mrscraper.com/docs/getting-started/mcp-server
  - type: SourceCode
    url: https://github.com/mrscraper-com/mrscraper-mcp
  - type: Package
    url: https://www.npmjs.com/package/@mrscraper/mcp
  aid: mrscraper:mrscraper-mcp-server
  image: https://mrscraper.com/og.png

method: searched
source: https://docs.mrscraper.com/docs/api/overview
sources:
- https://docs.mrscraper.com/docs/api/authentication
- https://docs.mrscraper.com/docs/api/pagination
- https://docs.mrscraper.com/docs/api/response-headers
- https://docs.mrscraper.com/docs/api/error-handling
